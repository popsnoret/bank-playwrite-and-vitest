name: CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tester
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera frontend
        run: npm ci --prefix frontend

      - name: Installera backend
        run: npm ci --prefix backend

      - name: Starta Docker Compose
        run: docker compose up -d --build

      - name: Vänta på databasen
        run: docker compose exec -T mysql mysqladmin ping -h localhost -ubank_app -pbank_password --wait=30

      - name: Vänta på backend
        run: |
          until curl --silent --show-error http://127.0.0.1:3001 > /dev/null; do
            sleep 2
          done

      - name: Vänta på frontend
        run: |
          until curl --fail http://127.0.0.1:3000; do
            sleep 2
          done

      - name: Installera tester
        run: npm ci --prefix tests

      - name: Installera Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Bygg frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: npm run build --prefix frontend

      - name: Kör Vitest
        run: npm run test:unit --prefix tests

      - name: Kör tester
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: bank_app
          DB_PASSWORD: bank_password
          DB_NAME: bank
        run: npm test --prefix tests

  check-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Kör lint
        working-directory: ./frontend
        run: npm run lint

      - name: Bygg frontend
        working-directory: ./frontend
        run: npm run build

  check-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Kör backend lint
        working-directory: ./backend
        run: npm run lint

  deploy:
    if: github.event_name == 'push'
    needs: [tests, check-frontend, check-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy till EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/bank-playwrite-and-vitest
            git pull
            sudo docker compose -f docker-compose.prod.yml down
            sudo docker compose -f docker-compose.prod.yml up --build -d
