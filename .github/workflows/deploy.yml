name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tester
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bank
          MYSQL_USER: bank_app
          MYSQL_PASSWORD: bank_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera frontend
        run: npm ci --prefix frontend

      - name: Installera backend
        run: npm ci --prefix backend

      - name: Skapa databastabeller
        run: docker exec -i $(docker ps -q --filter ancestor=mysql:8.4) mysql -ubank_app -pbank_password bank < database/init.sql

      - name: Installera tester
        run: npm ci --prefix tests

      - name: Installera Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Bygg frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: npm run build --prefix frontend

      - name: Kör tester
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: bank_app
          DB_PASSWORD: bank_password
          DB_NAME: bank
        run: npm test --prefix tests

  check-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Kör lint
        working-directory: ./frontend
        run: npm run lint

      - name: Bygg frontend
        working-directory: ./frontend
        run: npm run build

  check-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Kör backend lint
        working-directory: ./backend
        run: npm run lint

  deploy:
    needs: [tests, check-frontend, check-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy till EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/docker-bank
            git pull
            sudo docker compose down
            sudo docker compose up --build -d
